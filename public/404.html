<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie znaleziono strony – Hubert Paszkiewicz</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url(/fonts/cormorant-garamond-latin-500-italic.woff2) format('woff2')}
@font-face{font-family:'Jost';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/jost-latin-400-normal.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#5a1a2a;color:#ecdfe3;font:400 17px/1.7 "Jost",system-ui,sans-serif;text-align:center;padding:24px}
.box{border:1px solid rgba(201,180,138,.4);padding:clamp(32px,6vw,64px);max-width:560px;width:100%}
.n{font:italic 500 clamp(5rem,16vw,8rem)/1 "Cormorant Garamond",Georgia,serif;color:#c9b48a;margin:0}
h1{font:italic 500 2rem/1.2 "Cormorant Garamond",Georgia,serif;color:#fff;margin:10px 0 14px}
a{display:inline-block;margin-top:22px;background:#c9b48a;color:#3e101c;text-decoration:none;padding:16px 28px;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase}
a:hover{background:#e3d5b6}
a:focus-visible{outline:2px solid #fff;outline-offset:4px}
</style>
</head>
<body>
<main class="box">
  <p class="n">404</p>
  <h1>Tej strony tu nie ma</h1>
  <p>Adres mógł się zmienić. Wróć na stronę główną albo zadzwoń: <a href="tel:+48510085688" style="all:unset;color:#e3d5b6;cursor:pointer;border-bottom:1px solid #c9b48a">510 085 688</a>.</p>
  <a href="/">Strona główna</a>
</main>
</body>
</html>
