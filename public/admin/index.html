<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel administracyjny – Hubert Paszkiewicz</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin/admin.css?v=mvsjz3mz">
<script type="module" src="/admin/admin.js?v=mvsjz3mz"></script>
</head>
<body data-view="sections" data-pane="edit">

<!-- logowanie -->
<div class="login" id="login" hidden>
  <form class="login-box" id="login-form" autocomplete="on">
    <div class="lg-mono"><b>H · P</b><span>Panel administracyjny</span></div>
    <p class="lg-mode" id="login-mode"></p>
    <label for="lg-user">Login</label>
    <input id="lg-user" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false">
    <label for="lg-pass">Hasło</label>
    <div class="pass-wrap">
      <input id="lg-pass" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="eye" data-toggle-pass="lg-pass" aria-label="Pokaż hasło">Pokaż</button>
    </div>
    <p class="lg-err" id="login-err" role="alert"></p>
    <button class="b b-pri b-wide" type="submit">Zaloguj się</button>
    <a class="lg-back" href="/">← Wróć na stronę</a>
  </form>
</div>

<!-- panel -->
<div class="app" id="app" hidden>
  <header class="bar">
    <div class="bar-l">
      <span class="brand"><b>H · P</b> <span>Panel</span></span>
      <span class="mode" id="mode-badge"></span>
    </div>
    <div class="bar-r">
      <span class="dirty" id="dirty" hidden>● Niezapisane zmiany</span>
      <a class="b b-ghost hide-s" href="/" target="_blank" rel="noopener">Zobacz stronę ↗</a>
      <button class="b b-pri" id="save" type="button" disabled>Zapisz</button>
      <button class="b b-ghost" id="logout" type="button" title="Wyloguj">Wyloguj</button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="cols">
    <aside class="side" id="side">
      <nav class="tabs" role="tablist" aria-label="Sekcje panelu">
        <button role="tab" data-view="sections" aria-selected="true">Sekcje</button>
        <button role="tab" data-view="settings" aria-selected="false">Ustawienia</button>
        <button role="tab" data-view="password" aria-selected="false">Hasło</button>
        <button role="tab" data-view="backup" aria-selected="false">Kopie</button>
      </nav>
      <div class="side-body" id="side-body"></div>
    </aside>

    <main class="editor" id="editor" tabindex="-1"></main>

    <section class="preview" id="preview" aria-label="Podgląd">
      <div class="pv-bar">
        <div class="seg" role="group" aria-label="Zakres podglądu">
          <button type="button" data-pmode="section" aria-pressed="true">Sekcja</button>
          <button type="button" data-pmode="page" aria-pressed="false">Cała strona</button>
        </div>
        <div class="seg" role="group" aria-label="Urządzenie">
          <button type="button" data-device="desktop" aria-pressed="true" title="Komputer">Komputer</button>
          <button type="button" data-device="tablet" aria-pressed="false" title="Tablet">Tablet</button>
          <button type="button" data-device="phone" aria-pressed="false" title="Telefon">Telefon</button>
        </div>
      </div>
      <div class="pv-stage" id="pv-stage">
        <iframe id="pv" title="Podgląd strony" src="/admin/preview.html?v=mvsjz3mz"></iframe>
      </div>
      <p class="pv-foot" id="pv-foot"></p>
    </section>
  </div>

  <!-- dolny pasek na telefonie -->
  <nav class="panes" aria-label="Widok">
    <button type="button" data-pane="list">Lista</button>
    <button type="button" data-pane="edit" aria-pressed="true">Edycja</button>
    <button type="button" data-pane="preview">Podgląd</button>
  </nav>
</div>

<div class="modal" id="modal" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-h"><div id="modal-body"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
